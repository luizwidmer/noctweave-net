<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Noctweb Browser icon</title>
  <desc id="desc">Two offset Noctweave plates crossed by three wide corridors.</desc>
  <defs>
    <linearGradient id="tile-fill" x1="32" y1="24" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2030"/>
      <stop offset=".55" stop-color="#121625"/>
      <stop offset="1" stop-color="#080B16"/>
    </linearGradient>
    <linearGradient id="upper" x1="96" y1="32" x2="224" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#7B61FF"/><stop offset="1" stop-color="#5B9CFA"/></linearGradient>
    <linearGradient id="lower" x1="32" y1="80" x2="160" y2="224" gradientUnits="userSpaceOnUse"><stop stop-color="#5B9CFA"/><stop offset="1" stop-color="#3DD5C5"/></linearGradient>
    <mask id="corridor-cuts">
