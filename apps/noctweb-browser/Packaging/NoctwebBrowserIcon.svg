<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Noctweb Browser icon</title>
  <desc id="desc">Two offset Noctweave plates crossed by three wide corridors.</desc>
  <defs>
    <linearGradient id="tile-fill" x1="32" y1="24" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D1C23"/>
      <stop offset=".55" stop-color="#1B1217"/>
      <stop offset="1" stop-color="#120B0F"/>
    </linearGradient>
    <linearGradient id="upper" x1="96" y1="32" x2="224" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#FAF3EA"/><stop offset="1" stop-color="#EBC7AF"/></linearGradient>
    <linearGradient id="lower" x1="32" y1="80" x2="160" y2="224" gradientUnits="userSpaceOnUse"><stop stop-color="#C96A61"/><stop offset="1" stop-color="#922D35"/></linearGradient>
    <mask id="corridor-cuts">
