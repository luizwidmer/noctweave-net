{
  "name": "NoctwebBrowser",
  "options": {
    "minimumXcodeGenVersion": "2.46.0",
    "deploymentTarget": {
      "macOS": "14.0"
    }
  },
  "settings": {
    "base": {
      "DEVELOPMENT_TEAM": "9MY7SXN56X",
      "CODE_SIGN_STYLE": "Automatic",
      "SWIFT_VERSION": "6.0",
      "MACOSX_DEPLOYMENT_TARGET": "14.0",
      "CURRENT_PROJECT_VERSION": "6",
      "MARKETING_VERSION": "0.1.0",
      "DEBUG_INFORMATION_FORMAT": "dwarf-with-dsym",
      "ENABLE_HARDENED_RUNTIME": "YES",
      "ENABLE_APP_SANDBOX": "YES",
      "ENABLE_USER_SCRIPT_SANDBOXING": "YES",
      "ARCHS": "arm64"
    }
  },
  "packages": {
    "BrowserLocal": {
      "path": "."
    },
    "LabLocal": {
      "path": "../noctweb-lab"
    },
    "UILocal": {
      "path": "../noctweb-ui"
    },
    "Noctweave": {
      "url": "https://github.com/luizwidmer/Noctweave.git",
      "revision": "f8351b0412ec7f46c8fd18b4a5034d7a72f18d8f"
    }
  },
  "targets": {
    "NoctwebBrowserApp": {
      "type": "application",
      "platform": "macOS",
      "sources": [
        {
          "path": "Sources/NoctwebBrowser"
        },
        {
          "path": "Packaging/NoctwebBrowser.icns",
          "buildPhase": "resources"
        },
        {
          "path": "Packaging/PrivacyInfo.xcprivacy",
          "buildPhase": "resources"
        }
      ],
      "settings": {
        "base": {
          "PRODUCT_NAME": "Noctweb Browser",
          "EXECUTABLE_NAME": "NoctwebBrowser",
          "PRODUCT_BUNDLE_IDENTIFIER": "net.noctweave.noctweb-browser",
          "INFOPLIST_FILE": "Packaging/Info.plist",
          "GENERATE_INFOPLIST_FILE": "NO",
          "CODE_SIGN_ENTITLEMENTS": "Packaging/NoctwebBrowser.entitlements"
        }
      },
      "dependencies": [
        {
          "package": "BrowserLocal",
          "product": "NoctwebBrowserCore"
        },
        {
          "package": "LabLocal",
          "product": "NoctwebLabCore"
        },
        {
          "package": "UILocal",
          "product": "NoctwebUI"
        },
        {
          "package": "Noctweave",
          "product": "NoctweaveCore"
        }
      ]
    }
  },
  "schemes": {
    "NoctwebBrowser": {
      "build": {
        "targets": {
          "NoctwebBrowserApp": "all"
        }
      },
      "run": {
        "config": "Debug",
        "storeKitConfiguration": "SupportTips.storekit"
      },
      "archive": {
        "config": "Release"
      }
    }
  }
}
